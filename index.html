<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe, Checkers, and Chess</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f7fb;
        color: #1a1f36;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .game {
        width: 100%;
        max-width: 460px;
        background: #ffffff;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin: 0 0 14px;
        text-align: center;
        font-size: 1.6rem;
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .controls label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
      }

      select,
      button {
        border: 1px solid #ced7e0;
        border-radius: 8px;
        background: #fff;
        color: #1a1f36;
        font-size: 0.95rem;
        padding: 8px 10px;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        background: #f1f6ff;
      }

      .status {
        min-height: 24px;
        margin-bottom: 14px;
        font-weight: 600;
      }

      .board {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .cell {
        width: calc((100% - 16px) / 3);
        aspect-ratio: 1 / 1;
        border: 1px solid #ced7e0;
        border-radius: 10px;
        background: #fdfefe;
        font-size: clamp(2rem, 7vw, 2.6rem);
        font-weight: 700;
        color: #1a1f36;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s ease, transform 0.08s ease;
      }

      .cell:active,
      .checker-square:active {
        transform: scale(0.98);
      }

      .cell[disabled],
      .checker-square[disabled] {
        cursor: default;
      }

      .cell.last-move {
        background: #eef5ff;
      }

      .cell.win {
        background: #d8f6dc;
      }

      .checker-board {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        border: 4px solid #1d4ed8;
        border-radius: 10px;
        overflow: hidden;
      }

      .checker-square {
        width: 12.5%;
        aspect-ratio: 1 / 1;
        border: 0;
        border-radius: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition: box-shadow 0.2s ease, transform 0.08s ease;
      }

      .checker-square.light {
        background: #ffffff;
      }

      .checker-square.dark {
        background: #1d4ed8;
      }

      .checker-square.selected {
        box-shadow: inset 0 0 0 4px #ffe45e;
      }

      .checker-square.valid-move::after {
        content: "";
        width: 34%;
        height: 34%;
        border-radius: 50%;
        background: rgba(42, 117, 64, 0.62);
        position: absolute;
      }

      .checker-piece {
        width: 74%;
        height: 74%;
        border-radius: 50%;
        box-shadow: inset 0 3px 5px rgba(255, 255, 255, 0.35), inset 0 -5px 7px rgba(0, 0, 0, 0.22), 0 3px 4px rgba(0, 0, 0, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(0.75rem, 4vw, 1.2rem);
        font-weight: 800;
        line-height: 1;
        z-index: 1;
      }

      .checker-piece.red {
        background: #d73a31;
        color: #fff6d5;
      }

      .checker-piece.black {
        background: #1f2933;
        color: #ffe45e;
      }

      .checker-piece.king::before {
        content: "K";
      }

      .chess-board {
        display: flex;
        flex-wrap: wrap;
        gap: 0;
        border: 4px solid #1f2937;
        border-radius: 10px;
        overflow: hidden;
      }

      .chess-square {
        width: 12.5%;
        aspect-ratio: 1 / 1;
        border: 0;
        border-radius: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        font-size: clamp(1.2rem, 7vw, 2.15rem);
      }

      .chess-square.light {
        background: #f7efe0;
      }

      .chess-square.dark {
        background: #8f6a4d;
      }

      .chess-square.selected {
        box-shadow: inset 0 0 0 4px #ffe45e;
      }

      .chess-square.valid-move::after {
        content: "";
        width: 30%;
        height: 30%;
        border-radius: 50%;
        background: rgba(42, 117, 64, 0.62);
        position: absolute;
      }

      @media (max-width: 480px) {
        .game {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <h1 id="title">Tic-Tac-Toe</h1>

      <div class="controls">
        <label for="game-select">
          Game
          <select id="game-select" aria-label="Select game">
            <option value="tictactoe">Tic-Tac-Toe</option>
            <option value="checkers" selected>Checkers</option>
            <option value="chess">Chess</option>
          </select>
        </label>
        <label for="difficulty">
          Difficulty
          <select id="difficulty" aria-label="Select computer difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <button id="reset" type="button">Reset Game</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>

      <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board"></div>
    </main>

    <script>
      (function () {
        var PLAYER = 'X';
        var COMPUTER = 'O';
        var CHECKERS_PLAYER = 'red';
        var CHECKERS_COMPUTER = 'black';
        var CHESS_PLAYER = 'white';
        var CHESS_COMPUTER = 'black';
        var CHESS_PIECES = {
          white: { k: '\u2654', q: '\u2655', r: '\u2656', b: '\u2657', n: '\u2658', p: '\u2659' },
          black: { k: '\u265A', q: '\u265B', r: '\u265C', b: '\u265D', n: '\u265E', p: '\u265F' }
        };
        var WIN_LINES = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
          [0, 4, 8],
          [2, 4, 6]
        ];

        var boardElement = document.getElementById('board');
        var statusElement = document.getElementById('status');
        var resetButton = document.getElementById('reset');
        var difficultySelect = document.getElementById('difficulty');
        var gameSelect = document.getElementById('game-select');
        var titleElement = document.getElementById('title');

        var currentGame = 'checkers';
        var board = Array(9).fill('');
        var gameOver = false;
        var turn = PLAYER;
        var lastMove = -1;
        var winningLine = null;

        var checkersBoard = createInitialCheckersBoard();
        var checkersTurn = CHECKERS_PLAYER;
        var checkersGameOver = false;
        var checkersWinner = '';
        var selectedSquare = -1;
        var validCheckersMoves = [];

        var chessBoard = createInitialChessBoard();
        var chessTurn = CHESS_PLAYER;
        var chessGameOver = false;
        var chessWinner = '';
        var chessDraw = false;
        var selectedChessSquare = -1;
        var validChessMoves = [];
        var chessInCheckSide = '';

        function createTicTacToeBoardButtons() {
          boardElement.innerHTML = '';
          boardElement.className = 'board';
          boardElement.setAttribute('aria-label', 'Tic-Tac-Toe board');
          for (var i = 0; i < 9; i += 1) {
            var cellButton = document.createElement('button');
            cellButton.type = 'button';
            cellButton.className = 'cell';
            cellButton.setAttribute('role', 'gridcell');
            cellButton.setAttribute('aria-label', 'Cell ' + (i + 1));
            cellButton.dataset.index = String(i);
            cellButton.addEventListener('click', onCellClick);
            boardElement.appendChild(cellButton);
          }
        }

        function resetTicTacToeGame() {
          board = Array(9).fill('');
          gameOver = false;
          turn = PLAYER;
          lastMove = -1;
          winningLine = null;
          updateTicTacToeView();
        }

        function updateTicTacToeView() {
          var cells = boardElement.children;
          for (var i = 0; i < cells.length; i += 1) {
            var cell = cells[i];
            cell.textContent = board[i];
            cell.disabled = gameOver || turn !== PLAYER || board[i] !== '';
            cell.classList.remove('last-move');
            cell.classList.remove('win');

            if (i === lastMove) {
              cell.classList.add('last-move');
            }

            if (winningLine && winningLine.indexOf(i) !== -1) {
              cell.classList.add('win');
            }
          }

          var result = getTicTacToeResult(board);
          if (result.winner === PLAYER) {
            statusElement.textContent = 'You win!';
          } else if (result.winner === COMPUTER) {
            statusElement.textContent = 'Computer wins!';
          } else if (result.draw) {
            statusElement.textContent = "It's a draw.";
          } else if (turn === PLAYER) {
            statusElement.textContent = 'Your turn (X).';
          } else {
            statusElement.textContent = 'Computer thinking...';
          }
        }

        function onCellClick(event) {
          if (currentGame !== 'tictactoe' || gameOver || turn !== PLAYER) {
            return;
          }

          var index = Number(event.currentTarget.dataset.index);
          if (board[index] !== '') {
            return;
          }

          makeTicTacToeMove(index, PLAYER);
          updateTicTacToeView();
          var result = getTicTacToeResult(board);
          if (finishTicTacToeIfDone(result)) {
            updateTicTacToeView();
            return;
          }

          turn = COMPUTER;
          updateTicTacToeView();

          window.setTimeout(function () {
            if (currentGame !== 'tictactoe' || gameOver) {
              return;
            }
            var aiIndex = getTicTacToeComputerMove();
            if (aiIndex >= 0) {
              makeTicTacToeMove(aiIndex, COMPUTER);
            }
            var aiResult = getTicTacToeResult(board);
            finishTicTacToeIfDone(aiResult);
            if (!gameOver) {
              turn = PLAYER;
            }
            updateTicTacToeView();
          }, 250);
        }

        function makeTicTacToeMove(index, mark) {
          board[index] = mark;
          lastMove = index;
        }

        function finishTicTacToeIfDone(result) {
          if (result.winner || result.draw) {
            gameOver = true;
            winningLine = result.line;
            return true;
          }
          return false;
        }

        function getTicTacToeResult(currentBoard) {
          for (var i = 0; i < WIN_LINES.length; i += 1) {
            var line = WIN_LINES[i];
            var a = currentBoard[line[0]];
            var b = currentBoard[line[1]];
            var c = currentBoard[line[2]];
            if (a && a === b && b === c) {
              return { winner: a, draw: false, line: line };
            }
          }

          if (currentBoard.every(function (cell) { return cell !== ''; })) {
            return { winner: '', draw: true, line: null };
          }

          return { winner: '', draw: false, line: null };
        }

        function getTicTacToeAvailableMoves(currentBoard) {
          var moves = [];
          for (var i = 0; i < currentBoard.length; i += 1) {
            if (currentBoard[i] === '') {
              moves.push(i);
            }
          }
          return moves;
        }

        function getTicTacToeRandomMove(currentBoard) {
          var moves = getTicTacToeAvailableMoves(currentBoard);
          if (moves.length === 0) {
            return -1;
          }
          return moves[Math.floor(Math.random() * moves.length)];
        }

        function findTicTacToeLineMove(currentBoard, mark) {
          for (var i = 0; i < WIN_LINES.length; i += 1) {
            var line = WIN_LINES[i];
            var values = [
              currentBoard[line[0]],
              currentBoard[line[1]],
              currentBoard[line[2]]
            ];
            var markCount = values.filter(function (value) { return value === mark; }).length;
            var emptyCount = values.filter(function (value) { return value === ''; }).length;
            if (markCount === 2 && emptyCount === 1) {
              var emptyIndexInLine = values.indexOf('');
              return line[emptyIndexInLine];
            }
          }
          return -1;
        }

        function getTicTacToeMediumMove(currentBoard) {
          var winningMove = findTicTacToeLineMove(currentBoard, COMPUTER);
          if (winningMove >= 0) {
            return winningMove;
          }

          var blockingMove = findTicTacToeLineMove(currentBoard, PLAYER);
          if (blockingMove >= 0) {
            return blockingMove;
          }

          return getTicTacToeRandomMove(currentBoard);
        }

        function getTicTacToeHardMove(currentBoard) {
          var bestScore = -Infinity;
          var bestMove = -1;
          var moves = getTicTacToeAvailableMoves(currentBoard);

          for (var i = 0; i < moves.length; i += 1) {
            var move = moves[i];
            currentBoard[move] = COMPUTER;
            var score = minimax(currentBoard, false);
            currentBoard[move] = '';

            if (score > bestScore) {
              bestScore = score;
              bestMove = move;
            }
          }

          return bestMove;
        }

        function minimax(currentBoard, isMaximizing) {
          var result = getTicTacToeResult(currentBoard);
          if (result.winner === COMPUTER) {
            return 10;
          }
          if (result.winner === PLAYER) {
            return -10;
          }
          if (result.draw) {
            return 0;
          }

          var moves = getTicTacToeAvailableMoves(currentBoard);

          if (isMaximizing) {
            var bestScore = -Infinity;
            for (var i = 0; i < moves.length; i += 1) {
              var move = moves[i];
              currentBoard[move] = COMPUTER;
              var score = minimax(currentBoard, false);
              currentBoard[move] = '';
              bestScore = Math.max(bestScore, score);
            }
            return bestScore;
          }

          var minScore = Infinity;
          for (var j = 0; j < moves.length; j += 1) {
            var playerMove = moves[j];
            currentBoard[playerMove] = PLAYER;
            var playerScore = minimax(currentBoard, true);
            currentBoard[playerMove] = '';
            minScore = Math.min(minScore, playerScore);
          }
          return minScore;
        }

        function getTicTacToeComputerMove() {
          var difficulty = difficultySelect.value;
          if (difficulty === 'easy') {
            return getTicTacToeRandomMove(board.slice());
          }
          if (difficulty === 'medium') {
            return getTicTacToeMediumMove(board.slice());
          }
          return getTicTacToeHardMove(board.slice());
        }

        function createInitialCheckersBoard() {
          var newBoard = Array(64).fill(null);
          for (var row = 0; row < 8; row += 1) {
            for (var col = 0; col < 8; col += 1) {
              if (!isDarkSquare(row, col)) {
                continue;
              }
              if (row < 3) {
                newBoard[getCheckersIndex(row, col)] = { side: CHECKERS_COMPUTER, king: false };
              } else if (row > 4) {
                newBoard[getCheckersIndex(row, col)] = { side: CHECKERS_PLAYER, king: false };
              }
            }
          }
          return newBoard;
        }

        function createCheckersBoardButtons() {
          boardElement.innerHTML = '';
          boardElement.className = 'checker-board';
          boardElement.setAttribute('aria-label', 'Checkers board');
          for (var i = 0; i < 64; i += 1) {
            var squareButton = document.createElement('button');
            var position = getCheckersPosition(i);
            squareButton.type = 'button';
            squareButton.className = 'checker-square ' + (isDarkSquare(position.row, position.col) ? 'dark' : 'light');
            squareButton.setAttribute('role', 'gridcell');
            squareButton.setAttribute('aria-label', 'Row ' + (position.row + 1) + ', column ' + (position.col + 1));
            squareButton.dataset.index = String(i);
            squareButton.addEventListener('click', onCheckersSquareClick);
            boardElement.appendChild(squareButton);
          }
        }

        function resetCheckersGame() {
          checkersBoard = createInitialCheckersBoard();
          checkersTurn = CHECKERS_PLAYER;
          checkersGameOver = false;
          checkersWinner = '';
          selectedSquare = -1;
          validCheckersMoves = [];
          updateCheckersView();
        }

        function updateCheckersView() {
          var cells = boardElement.children;
          var validTargets = {};
          for (var i = 0; i < validCheckersMoves.length; i += 1) {
            validTargets[validCheckersMoves[i].to] = true;
          }

          for (var index = 0; index < cells.length; index += 1) {
            var cell = cells[index];
            var piece = checkersBoard[index];
            cell.innerHTML = '';
            cell.disabled = checkersGameOver || checkersTurn !== CHECKERS_PLAYER;
            cell.classList.remove('selected');
            cell.classList.remove('valid-move');
            if (index === selectedSquare) {
              cell.classList.add('selected');
            }
            if (validTargets[index]) {
              cell.classList.add('valid-move');
            }
            if (piece) {
              var pieceElement = document.createElement('span');
              pieceElement.className = 'checker-piece ' + piece.side + (piece.king ? ' king' : '');
              pieceElement.setAttribute('aria-hidden', 'true');
              cell.appendChild(pieceElement);
            }
          }

          if (checkersWinner === CHECKERS_PLAYER) {
            statusElement.textContent = 'You win!';
          } else if (checkersWinner === CHECKERS_COMPUTER) {
            statusElement.textContent = 'Computer wins!';
          } else if (checkersTurn === CHECKERS_PLAYER) {
            statusElement.textContent = 'Your turn (red).';
          } else {
            statusElement.textContent = 'Computer thinking...';
          }
        }

        function onCheckersSquareClick(event) {
          if (currentGame !== 'checkers' || checkersGameOver || checkersTurn !== CHECKERS_PLAYER) {
            return;
          }

          var index = Number(event.currentTarget.dataset.index);
          var move = getMoveToSquare(index);
          if (move) {
            makeCheckersMove(move);
            updateCheckersView();
            if (checkersGameOver) {
              return;
            }
            endCheckersPlayerTurn();
            return;
          }

          selectCheckersPiece(index);
        }

        function selectCheckersPiece(index) {
          var piece = checkersBoard[index];
          if (!piece || piece.side !== CHECKERS_PLAYER) {
            return;
          }
          var moves = getCheckersMovesForPiece(checkersBoard, index);
          if (moves.length === 0) {
            selectedSquare = -1;
            validCheckersMoves = [];
            updateCheckersView();
            return;
          }
          selectedSquare = index;
          validCheckersMoves = moves;
          updateCheckersView();
        }

        function getMoveToSquare(index) {
          for (var i = 0; i < validCheckersMoves.length; i += 1) {
            if (validCheckersMoves[i].to === index) {
              return validCheckersMoves[i];
            }
          }
          return null;
        }

        function endCheckersPlayerTurn() {
          selectedSquare = -1;
          validCheckersMoves = [];
          checkersTurn = CHECKERS_COMPUTER;
          updateCheckersView();
          window.setTimeout(function () {
            if (currentGame !== 'checkers' || checkersGameOver) {
              return;
            }
            playComputerCheckersTurn();
          }, 350);
        }

        function playComputerCheckersTurn() {
          var moves = getAllCheckersMoves(checkersBoard, CHECKERS_COMPUTER);
          if (moves.length === 0) {
            finishCheckersGame(CHECKERS_PLAYER);
            updateCheckersView();
            return;
          }

          var move = chooseCheckersMove(moves);
          makeCheckersMove(move);

          while (!checkersGameOver && move.capture !== -1 && !move.promoted) {
            var jumps = getCheckersJumpsForPiece(checkersBoard, move.to);
            if (jumps.length === 0) {
              break;
            }
            move = chooseCheckersMove(jumps);
            makeCheckersMove(move);
          }

          if (!checkersGameOver) {
            checkersTurn = CHECKERS_PLAYER;
            if (getAllCheckersMoves(checkersBoard, CHECKERS_PLAYER).length === 0) {
              finishCheckersGame(CHECKERS_COMPUTER);
            }
          }
          updateCheckersView();
        }

        function makeCheckersMove(move) {
          var piece = checkersBoard[move.from];
          checkersBoard[move.from] = null;
          if (move.capture !== -1) {
            checkersBoard[move.capture] = null;
          }
          checkersBoard[move.to] = piece;
          move.promoted = promoteCheckersPieceIfNeeded(move.to);
          selectedSquare = -1;
          validCheckersMoves = [];

          var opponent = piece.side === CHECKERS_PLAYER ? CHECKERS_COMPUTER : CHECKERS_PLAYER;
          if (countCheckersPieces(checkersBoard, opponent) === 0) {
            finishCheckersGame(piece.side);
          }
        }

        function promoteCheckersPieceIfNeeded(index) {
          var piece = checkersBoard[index];
          var row = getCheckersPosition(index).row;
          if (!piece || piece.king) {
            return false;
          }
          if ((piece.side === CHECKERS_PLAYER && row === 0) || (piece.side === CHECKERS_COMPUTER && row === 7)) {
            piece.king = true;
            return true;
          }
          return false;
        }

        function finishCheckersGame(winner) {
          checkersGameOver = true;
          checkersWinner = winner;
          checkersTurn = '';
        }

        function getAllCheckersMoves(currentBoard, side) {
          var moves = [];
          for (var i = 0; i < currentBoard.length; i += 1) {
            var piece = currentBoard[i];
            if (piece && piece.side === side) {
              var pieceMoves = getCheckersMovesForPiece(currentBoard, i);
              for (var j = 0; j < pieceMoves.length; j += 1) {
                moves.push(pieceMoves[j]);
              }
            }
          }
          return moves;
        }

        function getCheckersMovesForPiece(currentBoard, index) {
          var piece = currentBoard[index];
          var moves = [];
          if (!piece) {
            return moves;
          }
          var position = getCheckersPosition(index);
          var directions = getCheckersDirections(piece);
          for (var i = 0; i < directions.length; i += 1) {
            var direction = directions[i];
            var row = position.row + direction.row;
            var col = position.col + direction.col;
            if (!isOnCheckersBoard(row, col)) {
              continue;
            }
            var targetIndex = getCheckersIndex(row, col);
            var targetPiece = currentBoard[targetIndex];
            if (!targetPiece) {
              moves.push({ from: index, to: targetIndex, capture: -1, promoted: false });
            } else if (targetPiece && targetPiece.side !== piece.side) {
              var jumpRow = row + direction.row;
              var jumpCol = col + direction.col;
              if (isOnCheckersBoard(jumpRow, jumpCol)) {
                var jumpIndex = getCheckersIndex(jumpRow, jumpCol);
                if (!currentBoard[jumpIndex]) {
                  moves.push({ from: index, to: jumpIndex, capture: targetIndex, promoted: false });
                }
              }
            }
          }
          return moves;
        }

        function getCheckersJumpsForPiece(currentBoard, index) {
          return getCheckersMovesForPiece(currentBoard, index).filter(function (move) {
            return move.capture !== -1;
          });
        }

        function chooseCheckersMove(moves) {
          var difficulty = difficultySelect.value;
          if (difficulty === 'easy') {
            return getRandomCheckersMove(moves);
          }
          if (difficulty === 'medium') {
            return getBestImmediateCheckersMove(moves);
          }
          return getBestLookAheadCheckersMove(moves);
        }

        function getRandomCheckersMove(moves) {
          return moves[Math.floor(Math.random() * moves.length)];
        }

        function getBestImmediateCheckersMove(moves) {
          var bestScore = -Infinity;
          var bestMoves = [];
          for (var i = 0; i < moves.length; i += 1) {
            var score = scoreCheckersMove(checkersBoard, moves[i], CHECKERS_COMPUTER);
            if (score > bestScore) {
              bestScore = score;
              bestMoves = [moves[i]];
            } else if (score === bestScore) {
              bestMoves.push(moves[i]);
            }
          }
          return getRandomCheckersMove(bestMoves);
        }

        function getBestLookAheadCheckersMove(moves) {
          var bestScore = -Infinity;
          var bestMoves = [];
          for (var i = 0; i < moves.length; i += 1) {
            var boardAfterMove = copyCheckersBoard(checkersBoard);
            applyCheckersMoveToBoard(boardAfterMove, moves[i]);
            var score = evaluateCheckersBoard(boardAfterMove) + scoreCheckersMove(checkersBoard, moves[i], CHECKERS_COMPUTER);
            var playerReplies = getAllCheckersMoves(boardAfterMove, CHECKERS_PLAYER);
            for (var j = 0; j < playerReplies.length; j += 1) {
              var replyBoard = copyCheckersBoard(boardAfterMove);
              applyCheckersMoveToBoard(replyBoard, playerReplies[j]);
              score = Math.min(score, evaluateCheckersBoard(replyBoard));
            }
            if (score > bestScore) {
              bestScore = score;
              bestMoves = [moves[i]];
            } else if (score === bestScore) {
              bestMoves.push(moves[i]);
            }
          }
          return getRandomCheckersMove(bestMoves);
        }

        function scoreCheckersMove(currentBoard, move, side) {
          var score = 0;
          var piece = currentBoard[move.from];
          var targetRow = getCheckersPosition(move.to).row;
          if (move.capture !== -1) {
            score += currentBoard[move.capture] && currentBoard[move.capture].king ? 5 : 3;
          }
          if (piece && !piece.king && ((side === CHECKERS_COMPUTER && targetRow === 7) || (side === CHECKERS_PLAYER && targetRow === 0))) {
            score += 4;
          }
          return score;
        }

        function evaluateCheckersBoard(currentBoard) {
          var score = 0;
          for (var i = 0; i < currentBoard.length; i += 1) {
            var piece = currentBoard[i];
            if (piece) {
              var value = piece.king ? 5 : 3;
              score += piece.side === CHECKERS_COMPUTER ? value : -value;
            }
          }
          return score;
        }

        function applyCheckersMoveToBoard(currentBoard, move) {
          var piece = currentBoard[move.from];
          currentBoard[move.from] = null;
          if (move.capture !== -1) {
            currentBoard[move.capture] = null;
          }
          currentBoard[move.to] = piece;
          var row = getCheckersPosition(move.to).row;
          if (piece && !piece.king && ((piece.side === CHECKERS_PLAYER && row === 0) || (piece.side === CHECKERS_COMPUTER && row === 7))) {
            piece.king = true;
          }
        }

        function copyCheckersBoard(currentBoard) {
          return currentBoard.map(function (piece) {
            return piece ? { side: piece.side, king: piece.king } : null;
          });
        }

        function countCheckersPieces(currentBoard, side) {
          var count = 0;
          for (var i = 0; i < currentBoard.length; i += 1) {
            if (currentBoard[i] && currentBoard[i].side === side) {
              count += 1;
            }
          }
          return count;
        }

        function getCheckersDirections(piece) {
          if (piece.king) {
            return [
              { row: -1, col: -1 },
              { row: -1, col: 1 },
              { row: 1, col: -1 },
              { row: 1, col: 1 }
            ];
          }
          if (piece.side === CHECKERS_PLAYER) {
            return [
              { row: -1, col: -1 },
              { row: -1, col: 1 }
            ];
          }
          return [
            { row: 1, col: -1 },
            { row: 1, col: 1 }
          ];
        }

        function getCheckersPosition(index) {
          return { row: Math.floor(index / 8), col: index % 8 };
        }

        function getCheckersIndex(row, col) {
          return row * 8 + col;
        }

        function isOnCheckersBoard(row, col) {
          return row >= 0 && row < 8 && col >= 0 && col < 8;
        }

        function isDarkSquare(row, col) {
          return (row + col) % 2 === 1;
        }

        function getChessPosition(index) {
          return getCheckersPosition(index);
        }

        function getChessIndex(row, col) {
          return getCheckersIndex(row, col);
        }

        function isOnChessBoard(row, col) {
          return isOnCheckersBoard(row, col);
        }

        function createInitialChessBoard() {
          var newBoard = Array(64).fill(null);
          var backRank = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
          for (var col = 0; col < 8; col += 1) {
            newBoard[getChessIndex(0, col)] = { side: CHESS_COMPUTER, type: backRank[col] };
            newBoard[getChessIndex(1, col)] = { side: CHESS_COMPUTER, type: 'p' };
            newBoard[getChessIndex(6, col)] = { side: CHESS_PLAYER, type: 'p' };
            newBoard[getChessIndex(7, col)] = { side: CHESS_PLAYER, type: backRank[col] };
          }
          return newBoard;
        }

        function createChessBoardButtons() {
          boardElement.innerHTML = '';
          boardElement.className = 'chess-board';
          boardElement.setAttribute('aria-label', 'Chess board');
          for (var i = 0; i < 64; i += 1) {
            var squareButton = document.createElement('button');
            var position = getChessPosition(i);
            squareButton.type = 'button';
            squareButton.className = 'chess-square ' + (isDarkSquare(position.row, position.col) ? 'dark' : 'light');
            squareButton.setAttribute('role', 'gridcell');
            squareButton.setAttribute('aria-label', 'Row ' + (position.row + 1) + ', column ' + (position.col + 1));
            squareButton.dataset.index = String(i);
            squareButton.addEventListener('click', onChessSquareClick);
            boardElement.appendChild(squareButton);
          }
        }

        function resetChessGame() {
          chessBoard = createInitialChessBoard();
          chessTurn = CHESS_PLAYER;
          chessGameOver = false;
          chessWinner = '';
          chessDraw = false;
          selectedChessSquare = -1;
          validChessMoves = [];
          chessInCheckSide = '';
          updateChessView();
        }

        function updateChessView() {
          var cells = boardElement.children;
          var validTargets = {};
          for (var i = 0; i < validChessMoves.length; i += 1) {
            validTargets[validChessMoves[i].to] = true;
          }

          for (var index = 0; index < cells.length; index += 1) {
            var cell = cells[index];
            var piece = chessBoard[index];
            cell.textContent = piece ? getChessPieceSymbol(piece) : '';
            cell.disabled = chessGameOver || chessTurn !== CHESS_PLAYER;
            cell.classList.remove('selected');
            cell.classList.remove('valid-move');
            if (index === selectedChessSquare) {
              cell.classList.add('selected');
            }
            if (validTargets[index]) {
              cell.classList.add('valid-move');
            }
          }

          if (chessWinner === CHESS_PLAYER) {
            statusElement.textContent = 'You win!';
          } else if (chessWinner === CHESS_COMPUTER) {
            statusElement.textContent = 'Computer wins!';
          } else if (chessDraw) {
            statusElement.textContent = 'Stalemate.';
          } else if (chessTurn === CHESS_PLAYER) {
            statusElement.textContent = chessInCheckSide === CHESS_PLAYER ? 'Your turn (white). Check!' : 'Your turn (white).';
          } else {
            statusElement.textContent = chessInCheckSide === CHESS_COMPUTER ? 'Computer thinking... Check!' : 'Computer thinking...';
          }
        }

        function getChessPieceSymbol(piece) {
          return CHESS_PIECES[piece.side][piece.type] || '';
        }

        function onChessSquareClick(event) {
          if (currentGame !== 'chess' || chessGameOver || chessTurn !== CHESS_PLAYER) {
            return;
          }

          var index = Number(event.currentTarget.dataset.index);
          var move = getChessMoveToSquare(index);
          if (move) {
            makeChessMove(move);
            var playerState = getChessEndState(chessBoard, CHESS_COMPUTER, CHESS_PLAYER);
            if (playerState.over) {
              finishChessGame(playerState.winner, playerState.draw);
              updateChessView();
              return;
            }
            endChessPlayerTurn();
            return;
          }

          selectChessPiece(index);
        }

        function selectChessPiece(index) {
          var piece = chessBoard[index];
          if (!piece || piece.side !== CHESS_PLAYER) {
            return;
          }
          var moves = getChessMovesForPiece(chessBoard, index);
          if (moves.length === 0) {
            selectedChessSquare = -1;
            validChessMoves = [];
            updateChessView();
            return;
          }
          selectedChessSquare = index;
          validChessMoves = moves;
          updateChessView();
        }

        function getChessMoveToSquare(index) {
          for (var i = 0; i < validChessMoves.length; i += 1) {
            if (validChessMoves[i].to === index) {
              return validChessMoves[i];
            }
          }
          return null;
        }

        function endChessPlayerTurn() {
          selectedChessSquare = -1;
          validChessMoves = [];
          chessTurn = CHESS_COMPUTER;
          chessInCheckSide = isChessKingInCheck(chessBoard, CHESS_COMPUTER) ? CHESS_COMPUTER : '';
          updateChessView();
          window.setTimeout(function () {
            if (currentGame !== 'chess' || chessGameOver) {
              return;
            }
            playComputerChessTurn();
          }, 350);
        }

        function playComputerChessTurn() {
          var moves = getAllChessMoves(chessBoard, CHESS_COMPUTER);
          if (moves.length === 0) {
            var noMoveState = getChessEndState(chessBoard, CHESS_COMPUTER, CHESS_PLAYER);
            finishChessGame(noMoveState.winner, noMoveState.draw);
            updateChessView();
            return;
          }

          makeChessMove(chooseChessMove(moves));
          var endState = getChessEndState(chessBoard, CHESS_PLAYER, CHESS_COMPUTER);
          if (endState.over) {
            finishChessGame(endState.winner, endState.draw);
          } else {
            chessTurn = CHESS_PLAYER;
            chessInCheckSide = isChessKingInCheck(chessBoard, CHESS_PLAYER) ? CHESS_PLAYER : '';
          }
          updateChessView();
        }

        function makeChessMove(move) {
          var piece = chessBoard[move.from];
          chessBoard[move.from] = null;
          chessBoard[move.to] = piece;
          promoteChessPieceIfNeeded(move.to);
          selectedChessSquare = -1;
          validChessMoves = [];
          chessInCheckSide = '';
        }

        function promoteChessPieceIfNeeded(index) {
          var piece = chessBoard[index];
          if (!piece || piece.type !== 'p') {
            return;
          }
          var row = getChessPosition(index).row;
          if ((piece.side === CHESS_PLAYER && row === 0) || (piece.side === CHESS_COMPUTER && row === 7)) {
            piece.type = 'q';
          }
        }

        function finishChessGame(winner, draw) {
          chessGameOver = true;
          chessWinner = winner;
          chessDraw = !!draw;
          chessTurn = '';
          chessInCheckSide = '';
          selectedChessSquare = -1;
          validChessMoves = [];
        }

        function getChessEndState(currentBoard, sideToMove, mover) {
          var legalMoves = getAllChessMoves(currentBoard, sideToMove);
          if (legalMoves.length > 0) {
            return { over: false, winner: '', draw: false };
          }
          if (isChessKingInCheck(currentBoard, sideToMove)) {
            return { over: true, winner: mover, draw: false };
          }
          return { over: true, winner: '', draw: true };
        }

        function getAllChessMoves(currentBoard, side) {
          var moves = [];
          for (var i = 0; i < currentBoard.length; i += 1) {
            var piece = currentBoard[i];
            if (piece && piece.side === side) {
              var pieceMoves = getChessMovesForPiece(currentBoard, i);
              for (var j = 0; j < pieceMoves.length; j += 1) {
                moves.push(pieceMoves[j]);
              }
            }
          }
          return moves;
        }

        function getChessMovesForPiece(currentBoard, index) {
          var piece = currentBoard[index];
          if (!piece) {
            return [];
          }
          var pseudoMoves = getChessPseudoMovesForPiece(currentBoard, index, false);
          var legalMoves = [];
          for (var i = 0; i < pseudoMoves.length; i += 1) {
            var boardAfterMove = copyChessBoard(currentBoard);
            applyChessMoveToBoard(boardAfterMove, pseudoMoves[i]);
            if (!isChessKingInCheck(boardAfterMove, piece.side)) {
              legalMoves.push(pseudoMoves[i]);
            }
          }
          return legalMoves;
        }

        function getChessPseudoMovesForPiece(currentBoard, index, attackOnly) {
          var piece = currentBoard[index];
          if (!piece) {
            return [];
          }
          var position = getChessPosition(index);
          var moves = [];

          if (piece.type === 'p') {
            addChessPawnMoves(moves, currentBoard, index, position, piece, attackOnly);
            return moves;
          }

          if (piece.type === 'n') {
            addChessKnightMoves(moves, currentBoard, index, position, piece);
            return moves;
          }

          if (piece.type === 'b' || piece.type === 'r' || piece.type === 'q') {
            var directions = [];
            if (piece.type === 'b' || piece.type === 'q') {
              directions.push({ row: -1, col: -1 }, { row: -1, col: 1 }, { row: 1, col: -1 }, { row: 1, col: 1 });
            }
            if (piece.type === 'r' || piece.type === 'q') {
              directions.push({ row: -1, col: 0 }, { row: 1, col: 0 }, { row: 0, col: -1 }, { row: 0, col: 1 });
            }
            addChessSlidingMoves(moves, currentBoard, index, position, piece, directions);
            return moves;
          }

          addChessKingMoves(moves, currentBoard, index, position, piece);
          return moves;
        }

        function addChessPawnMoves(moves, currentBoard, index, position, piece, attackOnly) {
          var direction = piece.side === CHESS_PLAYER ? -1 : 1;
          var oneRow = position.row + direction;
          if (!attackOnly && isOnChessBoard(oneRow, position.col)) {
            var oneStepIndex = getChessIndex(oneRow, position.col);
            if (!currentBoard[oneStepIndex]) {
              moves.push({ from: index, to: oneStepIndex });
              var startRow = piece.side === CHESS_PLAYER ? 6 : 1;
              var twoRow = position.row + direction * 2;
              if (position.row === startRow && isOnChessBoard(twoRow, position.col)) {
                var twoStepIndex = getChessIndex(twoRow, position.col);
                if (!currentBoard[twoStepIndex]) {
                  moves.push({ from: index, to: twoStepIndex });
                }
              }
            }
          }

          var captureCols = [position.col - 1, position.col + 1];
          for (var i = 0; i < captureCols.length; i += 1) {
            var col = captureCols[i];
            var row = position.row + direction;
            if (!isOnChessBoard(row, col)) {
              continue;
            }
            var captureIndex = getChessIndex(row, col);
            if (attackOnly) {
              moves.push({ from: index, to: captureIndex });
              continue;
            }
            var targetPiece = currentBoard[captureIndex];
            if (targetPiece && targetPiece.side !== piece.side) {
              moves.push({ from: index, to: captureIndex });
            }
          }
        }

        function addChessKnightMoves(moves, currentBoard, index, position, piece) {
          var offsets = [
            { row: -2, col: -1 }, { row: -2, col: 1 }, { row: -1, col: -2 }, { row: -1, col: 2 },
            { row: 1, col: -2 }, { row: 1, col: 2 }, { row: 2, col: -1 }, { row: 2, col: 1 }
          ];
          for (var i = 0; i < offsets.length; i += 1) {
            var targetRow = position.row + offsets[i].row;
            var targetCol = position.col + offsets[i].col;
            if (!isOnChessBoard(targetRow, targetCol)) {
              continue;
            }
            var targetIndex = getChessIndex(targetRow, targetCol);
            var targetPiece = currentBoard[targetIndex];
            if (!targetPiece || targetPiece.side !== piece.side) {
              moves.push({ from: index, to: targetIndex });
            }
          }
        }

        function addChessSlidingMoves(moves, currentBoard, index, position, piece, directions) {
          for (var i = 0; i < directions.length; i += 1) {
            var row = position.row + directions[i].row;
            var col = position.col + directions[i].col;
            while (isOnChessBoard(row, col)) {
              var targetIndex = getChessIndex(row, col);
              var targetPiece = currentBoard[targetIndex];
              if (!targetPiece) {
                moves.push({ from: index, to: targetIndex });
              } else {
                if (targetPiece.side !== piece.side) {
                  moves.push({ from: index, to: targetIndex });
                }
                break;
              }
              row += directions[i].row;
              col += directions[i].col;
            }
          }
        }

        function addChessKingMoves(moves, currentBoard, index, position, piece) {
          for (var rowOffset = -1; rowOffset <= 1; rowOffset += 1) {
            for (var colOffset = -1; colOffset <= 1; colOffset += 1) {
              if (rowOffset === 0 && colOffset === 0) {
                continue;
              }
              var targetRow = position.row + rowOffset;
              var targetCol = position.col + colOffset;
              if (!isOnChessBoard(targetRow, targetCol)) {
                continue;
              }
              var targetIndex = getChessIndex(targetRow, targetCol);
              var targetPiece = currentBoard[targetIndex];
              if (!targetPiece || targetPiece.side !== piece.side) {
                moves.push({ from: index, to: targetIndex });
              }
            }
          }
        }

        function isChessKingInCheck(currentBoard, side) {
          var kingIndex = findChessKingIndex(currentBoard, side);
          if (kingIndex < 0) {
            return true;
          }
          var opponent = side === CHESS_PLAYER ? CHESS_COMPUTER : CHESS_PLAYER;
          for (var i = 0; i < currentBoard.length; i += 1) {
            var piece = currentBoard[i];
            if (!piece || piece.side !== opponent) {
              continue;
            }
            var attackMoves = getChessPseudoMovesForPiece(currentBoard, i, true);
            for (var j = 0; j < attackMoves.length; j += 1) {
              if (attackMoves[j].to === kingIndex) {
                return true;
              }
            }
          }
          return false;
        }

        function findChessKingIndex(currentBoard, side) {
          for (var i = 0; i < currentBoard.length; i += 1) {
            var piece = currentBoard[i];
            if (piece && piece.side === side && piece.type === 'k') {
              return i;
            }
          }
          return -1;
        }

        function chooseChessMove(moves) {
          var difficulty = difficultySelect.value;
          if (difficulty === 'easy') {
            return getRandomChessMove(moves);
          }
          if (difficulty === 'medium') {
            return getBestImmediateChessMove(moves);
          }
          return getBestLookAheadChessMove(moves);
        }

        function getRandomChessMove(moves) {
          return moves[Math.floor(Math.random() * moves.length)];
        }

        function getBestImmediateChessMove(moves) {
          var bestScore = -Infinity;
          var bestMoves = [];
          for (var i = 0; i < moves.length; i += 1) {
            var score = scoreChessMove(chessBoard, moves[i], CHESS_COMPUTER);
            if (score > bestScore) {
              bestScore = score;
              bestMoves = [moves[i]];
            } else if (score === bestScore) {
              bestMoves.push(moves[i]);
            }
          }
          return getRandomChessMove(bestMoves);
        }

        function getBestLookAheadChessMove(moves) {
          var bestScore = -Infinity;
          var bestMoves = [];
          for (var i = 0; i < moves.length; i += 1) {
            var boardAfterMove = copyChessBoard(chessBoard);
            applyChessMoveToBoard(boardAfterMove, moves[i]);
            var score = evaluateChessBoard(boardAfterMove) + scoreChessMove(chessBoard, moves[i], CHESS_COMPUTER);
            var playerReplies = getAllChessMoves(boardAfterMove, CHESS_PLAYER);
            if (playerReplies.length === 0) {
              score += isChessKingInCheck(boardAfterMove, CHESS_PLAYER) ? 10000 : 0;
            } else {
              var worstReplyScore = Infinity;
              for (var j = 0; j < playerReplies.length; j += 1) {
                var replyBoard = copyChessBoard(boardAfterMove);
                applyChessMoveToBoard(replyBoard, playerReplies[j]);
                var replyScore = evaluateChessBoard(replyBoard) - scoreChessMove(boardAfterMove, playerReplies[j], CHESS_PLAYER);
                worstReplyScore = Math.min(worstReplyScore, replyScore);
              }
              score = worstReplyScore;
            }
            if (score > bestScore) {
              bestScore = score;
              bestMoves = [moves[i]];
            } else if (score === bestScore) {
              bestMoves.push(moves[i]);
            }
          }
          return getRandomChessMove(bestMoves);
        }

        function scoreChessMove(currentBoard, move, side) {
          var score = 0;
          var piece = currentBoard[move.from];
          var targetPiece = currentBoard[move.to];
          if (targetPiece) {
            score += getChessPieceValue(targetPiece.type) * 2;
          }
          var targetRow = getChessPosition(move.to).row;
          if (piece && piece.type === 'p' && ((side === CHESS_COMPUTER && targetRow === 7) || (side === CHESS_PLAYER && targetRow === 0))) {
            score += 8;
          }
          var boardAfterMove = copyChessBoard(currentBoard);
          applyChessMoveToBoard(boardAfterMove, move);
          var opponent = side === CHESS_PLAYER ? CHESS_COMPUTER : CHESS_PLAYER;
          if (isChessKingInCheck(boardAfterMove, opponent)) {
            score += 1;
          }
          return score;
        }

        function evaluateChessBoard(currentBoard) {
          var score = 0;
          for (var i = 0; i < currentBoard.length; i += 1) {
            var piece = currentBoard[i];
            if (!piece) {
              continue;
            }
            var value = getChessPieceValue(piece.type);
            score += piece.side === CHESS_COMPUTER ? value : -value;
          }
          return score;
        }

        function getChessPieceValue(type) {
          if (type === 'p') {
            return 1;
          }
          if (type === 'n' || type === 'b') {
            return 3;
          }
          if (type === 'r') {
            return 5;
          }
          if (type === 'q') {
            return 9;
          }
          return 100;
        }

        function applyChessMoveToBoard(currentBoard, move) {
          var piece = currentBoard[move.from];
          currentBoard[move.from] = null;
          currentBoard[move.to] = piece;
          if (piece && piece.type === 'p') {
            var row = getChessPosition(move.to).row;
            if ((piece.side === CHESS_PLAYER && row === 0) || (piece.side === CHESS_COMPUTER && row === 7)) {
              piece.type = 'q';
            }
          }
        }

        function copyChessBoard(currentBoard) {
          return currentBoard.map(function (piece) {
            return piece ? { side: piece.side, type: piece.type } : null;
          });
        }

        function resetCurrentGame() {
          if (currentGame === 'checkers') {
            resetCheckersGame();
          } else if (currentGame === 'chess') {
            resetChessGame();
          } else {
            resetTicTacToeGame();
          }
        }

        function switchGame() {
          currentGame = gameSelect.value;
          if (currentGame === 'checkers') {
            titleElement.textContent = 'Checkers';
            createCheckersBoardButtons();
          } else if (currentGame === 'chess') {
            titleElement.textContent = 'Chess';
            createChessBoardButtons();
          } else {
            titleElement.textContent = 'Tic-Tac-Toe';
            createTicTacToeBoardButtons();
          }
          resetCurrentGame();
        }

        resetButton.addEventListener('click', resetCurrentGame);
        difficultySelect.addEventListener('change', resetCurrentGame);
        gameSelect.addEventListener('change', switchGame);

        gameSelect.value = currentGame;
        switchGame();
      })();
    </script>
  </body>
</html>
